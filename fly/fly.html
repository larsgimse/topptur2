<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flyradar - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --flight-yellow: #ffd700;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-save { background: #166534; border-color: #22c55e; }
        .btn-flights.active { background: #d97706; border-color: #fff; color: #fff; }

        #map-container { flex: 1; width: 100%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: var(--bg-color); }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ui-panel {
            background: var(--panel-bg); 
            padding: 12px 15px; 
            border-radius: 12px; 
            border: 1px solid #333;
            backdrop-filter: blur(8px);
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            min-width: 180px;
        }
        
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: #ddd; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #f59e0b; }
        input:checked + .slider:before { transform: translateX(16px); }

        .alt-slider { width: 60px; cursor: pointer; accent-color: #f59e0b; }
        
        .counter { 
            position: fixed; bottom: 20px; left: 20px; z-index: 10000;
            background: var(--panel-bg); padding: 6px 14px; border-radius: 20px; 
            border: 1px solid #333; font-size: 0.8rem; color: #ffd700;
        }
    </style>
</head>
<body>

    <header>
        <h1>Flyradar</h1>
        <div class="nav-buttons">
            <button id="btn-save" class="btn btn-save">💾 Lagre til fly.json</button>
            <button id="btn-fly" class="btn btn-flights active">✈️ Aktiv</button>
        </div>
    </header>

    <div class="panels-container">
        <div id="flight-panel" class="ui-panel">
            <div class="row">Haler: <label class="switch"><input type="checkbox" id="trailSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Flynr: <label class="switch"><input type="checkbox" id="flightNumSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Høyde: <input type="range" id="altSlider" class="alt-slider" min="0" max="2" value="0"></div>
        </div>
    </div>

    <div id="counter" class="counter">Fly synlige: 0</div>

    <div id="map-container"><div id="map"></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', { renderer: L.canvas() }).setView([69.65, 18.95], 9);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        let flights = {};
        const flightCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(flightCanvas);
        const flightCtx = flightCanvas.getContext('2d');

        // Laster arkiv ved start
        fetch('fly.json').then(res => res.json()).then(data => { flights = data; }).catch(() => console.log("Starter ny sesjon"));

        async function fetchFlights() {
            const b = map.getBounds();
            const url = `https://corsproxy.io/?https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${b.getNorth()},${b.getSouth()},${b.getWest()},${b.getEast()}`;
            const res = await fetch(url);
            const data = await res.json();
            for (let id in data) {
                if (id === "full_count" || id === "version" || id === "stats") continue;
                if (!flights[id]) flights[id] = { history: [] };
                flights[id].lat = data[id][1]; flights[id].lon = data[id][2];
                flights[id].flight = data[id][13];
                const newPoint = [data[id][1], data[id][2]];
                if (flights[id].history.length === 0 || (flights[id].history[flights[id].history.length-1][0] !== newPoint[0])) {
                    flights[id].history.push(newPoint);
                }
            }
            document.getElementById('counter').innerText = "Fly synlige: " + Object.keys(data).length;
        }

        function draw() {
            flightCtx.clearRect(0, 0, flightCanvas.width, flightCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            for (let id in flights) {
                const f = flights[id];
                const p = map.latLngToLayerPoint([f.lat, f.lon]);
                
                // Tegn spor
                flightCtx.beginPath();
                flightCtx.strokeStyle = "rgba(255, 215, 0, 0.6)";
                flightCtx.lineWidth = 2;
                f.history.forEach((h, i) => {
                    const hp = map.latLngToLayerPoint(h);
                    i === 0 ? flightCtx.moveTo(hp.x - tl.x, hp.y - tl.y) : flightCtx.lineTo(hp.x - tl.x, hp.y - tl.y);
                });
                flightCtx.stroke();
                
                // Fly-prikk
                flightCtx.fillStyle = "#ffd700";
                flightCtx.beginPath(); flightCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); flightCtx.fill();
            }
            requestAnimationFrame(draw);
        }

        // Eksportfunksjon
        document.getElementById('btn-save').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(flights));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "fly.json");
            dl.click();
        });

        setInterval(fetchFlights, 15000);
        draw();
        
        map.on('moveend', () => {
            const b = map.getBounds(), size = map.getSize(), tl = map.latLngToLayerPoint(b.getNorthWest());
            flightCanvas.style.left = tl.x + 'px'; flightCanvas.style.top = tl.y + 'px';
            flightCanvas.width = size.x; flightCanvas.height = size.y;
        });
    </script>
</body>
</html>
