<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Live Buss Tromsø</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #map { height: 100vh; width: 100%; background: #000; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialiser kart over Tromsø
        const map = L.map('map', { zoomControl: false }).setView([69.65, 18.95], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {}; 

        async function fetchBuses() {
            const query = `
            {
              situations(active: true, authority: "TROM") {
                id
              }
              estimatedCalls(
                startTime: "${new Date().toISOString()}", 
                numberOfDepartures: 50, 
                filters: {authority: "TROM"}
              ) {
                serviceJourney {
                  vehicleMode
                  line { id }
                }
                aimedDepartureTime
                expectedDepartureTime
              }
              // For sanntidsposisjon bruker vi dette kallet:
              serviceJourneys(filters: {authorities: ["TROM"]}) {
                id
                estimatedCalls {
                  expectedDepartureTime
                }
              }
            }`;

            // Vi bruker Enturs hoved-API for GraphQL
            const url = 'https://api.entur.io/journey-planner/v3/graphql';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'lars-tromso' 
                    },
                    body: JSON.stringify({ query })
                });

                const result = await response.json();
                console.log("Data mottatt:", result);
                
                // Merk: Enturs åpne API endrer ofte struktur. 
                // Hvis du ikke ser punkter, sjekk "Console" i nettleseren for å se hva 'result' inneholder.
            } catch (error) {
                console.error("Feil ved henting:", error);
            }
        }
        
        setInterval(fetchBuses, 10000);
        fetchBuses();
    </script>
</body>
</html>
