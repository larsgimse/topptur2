<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Live Buss Tromsø</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; }
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([69.65, 18.95], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let markers = {};

        async function fetchBuses() {
            const query = `
            {
              vehiclePositions(filters: {operatorIds: ["TROM:Operator"]}) {
                vehicle { id }
                position { latitude longitude }
              }
            }`;

            try {
                const response = await fetch('https://api.entur.io/realtime/v1/gtfs/rt/vehicle-positions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'lars-tromso' 
                    },
                    body: JSON.stringify({ query: "{ vehiclePositions(filters: {operatorIds: [\"TROM:Operator\"]}) { vehicle { id } position { latitude longitude } } }" })
                });
                
                const result = await response.json();
                console.log("Data:", result); // Sjekk konsollen (F12)
            } catch (e) { console.error(e); }
        }
        
        setInterval(fetchBuses, 10000);
        fetchBuses();
    </script>
</body>
</html>
