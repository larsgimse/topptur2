<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toppturer - Oversiktskart</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: #1a1a1a;
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02; /* Strava-oransje for hovring */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 1000;
        }

        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .btn:hover { background: #3a3a3a; }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }
        .btn-reset:hover {
            background: #2d2d2d;
            border-color: var(--highlight-orange);
            color: #fff;
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        /* Endrer musa til en pekefinger når du hovrer over kartet for å vise at sporene kan klikkes på */
        .leaflet-interactive {
            cursor: pointer;
        }

        #loading-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .track-tooltip {
            background: rgba(26, 26, 26, 0.95) !important;
            border: 1px solid var(--highlight-orange) !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 13px;
            border-radius: 4px;
            padding: 4px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .track-tooltip:before {
            border-top-color: rgba(26, 26, 26, 0.95) !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer - Alle Spor</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill kart</button>
            <a href="vinter.html" class="btn">❄️ Vinter</a>
            <a href="sommer.html" class="btn">☀️ Sommer</a>
        </div>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">Laster GPX-spor... <span id="progress">0</span>/<span id="total">0</span></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-gpx plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Definerer listen med type (vinter/sommer) så kartet vet hvilken side du skal videresendes til
        const topper = [
            { navn: "884", fil: "2026_03_27.gpx", type: "vinter" },
            { navn: "Bentsjordtinden", fil: "2026_04_03.gpx", type: "vinter" },
            { navn: "Buren", fil: "2026_01_10.gpx", type: "vinter" },
            { navn: "Burshammeren", fil: "2026_03_26.gpx", type: "vinter" },
            { navn: "Fagerfjellet", fil: "2025_04_22.gpx", type: "vinter" },
            { navn: "Gabrielfjellet", fil: "2025_05_25.gpx", type: "vinter" },
            { navn: "Gorzelvtinden", fil: "2025_12_06.gpx", type: "vinter" },
            { navn: "Gråtinden", fil: "2026_04_06.gpx", type: "vinter" },
            { navn: "Klemmartindan", fil: "2024_04_28.gpx", type: "vinter" },
            { navn: "Langfjellaksla", fil: "2026_04_08.gpx", type: "vinter" },
            { navn: "Middagstinden", fil: "2024_04_21.gpx", type: "vinter" },
            { navn: "Rema 1000", fil: "2026_03_28.gpx", type: "vinter" },
            { navn: "Skittentinden", fil: "2026_03_15.gpx", type: "vinter" },
            { navn: "Sollidalsaksla", fil: "2026_03_16.gpx", type: "vinter" },
            { navn: "Steinskartinden", fil: "2026_03_08.gpx", type: "vinter" },
            { navn: "Stormheimfjellet", fil: "2024_04_06.gpx", type: "vinter" },
            { navn: "Storstolpan", fil: "2025_05_08.gpx", type: "vinter" },
            { navn: "Stortinden", fil: "2024_03_26.gpx", type: "vinter" },
            { navn: "Straumsaksla", fil: "2025_05_24.gpx", type: "vinter" },
            { navn: "Svartnestinden", fil: "2026_04_05.gpx", type: "vinter" },
            { navn: "Tromsdalstinden", fil: "2026_05_14.gpx", type: "vinter" },
            { navn: "Tverrfjellet", fil: "2023_12_29.gpx", type: "vinter" }
            // Her kan du også legge inn sommerturer etterhvert, f.eks:
            // { navn: "Kjølen", fil: "2026_07_12.gpx", type: "sommer" }
        ];

        // 2. Initialiser kartet med mørk bakgrunn
        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18
        }).setView([69.65, 18.95], 9);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 3. Innstillinger for tynne, hvite linjer uten start/stopp-ikoner
        const gpxOptions = {
            async: true,
            polyline_options: {
                color: '#ffffff',
                opacity: 0.4,
                weight: 1.2,
                lineCap: 'round'
            },
            marker_options: {
                startIconUrl: null,
                endIconUrl: null,
                shadowUrl: null
            }
        };

        // 4. Håndtering av fremdrift og automatisk samling av kartgrenser
        let loadedCount = 0;
        const totalFiles = topper.length;
        const bounds = L.latLngBounds();
        
        document.getElementById('total').textContent = totalFiles;

        function zoomTilAlleSpor() {
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        function sjekkFremdrift() {
            loadedCount++;
            document.getElementById('progress').textContent = loadedCount;

            if (loadedCount === totalFiles) {
                zoomTilAlleSpor();
                const statusEl = document.getElementById('loading-status');
                statusEl.style.opacity = '0';
                setTimeout(() => statusEl.remove(), 500);
            }
        }

        // 5. Loop gjennom listen og tegn sporene med hovringseffekter og klikk-viderekobling
        topper.forEach(topp => {
            const track = new L.GPX(topp.fil, gpxOptions);
            
            track.on('loaded', function(e) {
                const layer = e.target;
                const gpxBounds = layer.getBounds();
                if (gpxBounds.isValid()) {
                    bounds.extend(gpxBounds);
                }
                
                // Flytende tooltip som følger musa
                layer.bindTooltip(`${topp.navn} <span style="font-size:10px; font-weight:normal; color:#aaa;"><br>Klikk for å åpne turen</span>`, {
                    sticky: true,
                    className: 'track-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });

                // HOVER-EFFEKT: Mus inn
                layer.on('mouseover', function() {
                    layer.setStyle({
                        color: 'var(--highlight-orange)',
                        weight: 3.5,
                        opacity: 1.0
                    });
                    layer.bringToFront();
                });

                // HOVER-EFFEKT: Mus ut
                layer.on('mouseout', function() {
                    layer.setStyle({
                        color: '#ffffff',
                        weight: 1.2,
                        opacity: 0.4
                    });
                });

                // NY KLIKK-FUNKSJON: Sender brukeren til riktig HTML-side basert på tur-type
                layer.on('click', function() {
                    // Lager en URL-parameter, f.eks: vinter.html?fjell=Buren
                    const målside = topp.type === "sommer" ? "sommer.html" : "vinter.html";
                    window.location.href = `${målside}?fjell=${encodeURIComponent(topp.navn)}`;
                });
                
                sjekkFremdrift();
            });

            track.on('error', function(e) {
                console.warn("Kunne ikke laste filen: " + topp.fil);
                sjekkFremdrift();
            });

            track.addTo(map);
        });

        // 6. Nullstill kart-knapp
        document.getElementById('btn-reset').addEventListener('click', function() {
            zoomTilAlleSpor();
        });
    </script>
</body>
</html>
