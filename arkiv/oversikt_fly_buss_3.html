<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
            --flight-yellow: #ffd700;
            --bus-red: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }
        .btn-flights.active { background: #d97706; border-color: #fff; font-weight: 700; color: #fff; }
        .btn-bus.active { background: #dc2626; border-color: #fff; font-weight: 700; color: #fff; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--highlight-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .panels-container {
            position: fixed;
            top: 75px;
            right: 10px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .ui-panel {
            background: var(--panel-bg); 
            padding: 12px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: inherit; 
            display: none; 
            flex-direction: column; 
            gap: 8px;
            min-width: 180px;
            pointer-events: auto;
        }
        
        .ui-panel.active { display: flex; }
        
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: #ddd; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        
        #flight-panel input:checked + .slider { background-color: #f59e0b; }
        #bus-panel input:checked + .slider { background-color: #ef4444; }
        
        input:checked + .slider:before { transform: translateX(16px); }

        .alt-slider { width: 60px; cursor: pointer; accent-color: #f59e0b; }
        
        .counter-box { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .counter { 
            background: var(--panel-bg); 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #333;
            font-size: 0.8rem; 
            display: none;
        }
        #counter.active { display: block; color: #ffd700; }
        #bus-counter.active { display: block; color: #ef4444; }

        .overlay-canvas {
            pointer-events: none;
            z-index: 450;
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 8px 4px;
                font-size: 0.75rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .panels-container {
                top: 10px;
                right: 10px;
                max-width: 200px;
            }
            .counter-box {
                bottom: 120px;
                left: 10px;
            }
            .leaflet-bottom { bottom: 120px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
            <button id="btn-fly" class="btn btn-flights">✈️ Fly</button>
            <button id="btn-buss" class="btn btn-bus">🚌 Buss</button>
        </div>
    </header>

    <div class="panels-container">
        <!-- FLY PANEL -->
        <div id="flight-panel" class="ui-panel">
            <div class="row">Haler: <label class="switch"><input type="checkbox" id="trailSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Flynr: <label class="switch"><input type="checkbox" id="flightNumSwitch"><span class="slider"></span></label></div>
            <div class="row">Kallesignal: <label class="switch"><input type="checkbox" id="callsignSwitch"><span class="slider"></span></label></div>
            <div class="row">Registrering: <label class="switch"><input type="checkbox" id="regSwitch"><span class="slider"></span></label></div>
            <div class="row">Høyde (Av/Fot/m): <input type="range" id="altSlider" class="alt-slider" min="0" max="2" value="0"></div>
            <div class="row">Fra: <label class="switch"><input type="checkbox" id="originSwitch"><span class="slider"></span></label></div>
            <div class="row">Til: <label class="switch"><input type="checkbox" id="destSwitch"><span class="slider"></span></label></div>
        </div>

        <!-- BUSS PANEL -->
        <div id="bus-panel" class="ui-panel">
            <div class="row">Linjenr: <label class="switch"><input type="checkbox" id="busLineSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Destinasjon: <label class="switch"><input type="checkbox" id="busDestSwitch" checked><span class="slider"></span></label></div>
            <div class="row">Forsinkelse: <label class="switch"><input type="checkbox" id="busDelaySwitch"><span class="slider"></span></label></div>
        </div>
    </div>

    <div class="counter-box">
        <div id="counter" class="counter">Fly synlige: 0</div>
        <div id="bus-counter" class="counter">Busser: Laster...</div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">
            <span class="spinner"></span>
            <span id="loading-text">Leser inn hovedspor...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([69.65, 18.95], 9);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO &copy; Entur',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const gpxOptions = {
            async: true,
            polyline_options: {
                color: '#ffffff',
                opacity: 0.4,
                weight: 1.4,
                lineCap: 'round'
            },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        let isFinishedLoading = false;
        const bounds = L.latLngBounds();
        const lagredeSpor = [];

        async function hentTopper(url, type) {
            try {
                const response = await fetch(url);
                if (!response.ok) return [];

                if (url.endsWith('.json')) {
                    const data = await response.json();
                    return data.map(topp => ({
                        navn: topp.navn,
                        fil: topp.fil,
                        type: type
                    }));
                }

                const htmlText = await response.text();
                const funneTopper = [];

                const topperBlockMatch = htmlText.match(/(?:const|let|var)\s+\w*(?:topper|turer)\w*\s*=\s*(\[[\s\S]*?\]);/i);

                if (topperBlockMatch && topperBlockMatch[1]) {
                    const blockText = topperBlockMatch[1];
                    const objectRegex = /\{[\s\S]*?\}/g;
                    let objMatch;

                    while ((objMatch = objectRegex.exec(blockText)) !== null) {
                        const objStr = objMatch[0];
                        const navnMatch = objStr.match(/(?:navn|tittel|title|name)\s*:\s*["']([^"']+)["']/i);
                        const gpxMatch = objStr.match(/["']([^"']+\.gpx)["']/i);

                        if (gpxMatch && gpxMatch[1]) {
                            const filnavn = gpxMatch[1].split('/').pop().trim();
                            const fjellNavn = navnMatch ? navnMatch[1].trim() : filnavn.replace('.gpx', '');

                            if (!funneTopper.some(t => t.fil === filnavn)) {
                                funneTopper.push({ navn: fjellNavn, fil: filnavn, type });
                            }
                        }
                    }
                }

                return funneTopper;

            } catch (error) {
                console.warn("Kunne ikke laste data fra " + url, error);
                return [];
            }
        }

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            lagredeSpor.forEach(item => {
                if (map.hasLayer(item.layer)) {
                    aktiveBounds.extend(item.layer.getBounds());
                }
            });
            if (aktiveBounds.isValid()) {
                map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        }

        function sjekkFremdrift() {
            if (isFinishedLoading) return;
            loadedCount++;
            
            const statusText = document.getElementById('loading-text');
            if (statusText) {
                statusText.textContent = `Laster inn hovedspor... ${loadedCount}/${totalFiles}`;
            }

            if (loadedCount >= totalFiles) {
                isFinishedLoading = true;
                zoomTilAktiveSpor();
                const statusEl = document.getElementById('loading-status');
                if (statusEl) {
                    statusEl.style.opacity = '0';
                    setTimeout(() => { if (statusEl) statusEl.remove(); }, 500);
                }
            }
        }

        async function initialiserKart() {
            const [vinterTopper, sommerTopper] = await Promise.all([
                hentTopper('vinter.html', 'vinter'),
                hentTopper('sommer_topper.json', 'sommer')
            ]);

            const unikeTopperMap = new Map();
            [...vinterTopper, ...sommerTopper].forEach(t => unikeTopperMap.set(t.fil, t));
            const alleTopper = Array.from(unikeTopperMap.values());

            totalFiles = alleTopper.length;

            if (totalFiles === 0) {
                const statusEl = document.getElementById('loading-status');
                if (statusEl) statusEl.innerHTML = "Ingen spor funnet.";
                return;
            }

            document.getElementById('loading-text').textContent = `Laster inn hovedspor... 0/${totalFiles}`;

            alleTopper.forEach(topp => {
                let fullført = false;

                const tryNext = () => {
                    if (!fullført) {
                        fullført = true;
                        sjekkFremdrift();
                    }
                };

                try {
                    const track = new L.GPX('gpx/' + topp.fil, gpxOptions);
                    
                    track.on('loaded', function(e) {
                        const layer = e.target;
                        lagredeSpor.push({ layer: layer, type: topp.type });

                        const gpxBounds = layer.getBounds();
                        if (gpxBounds.isValid()) {
                            bounds.extend(gpxBounds);
                        }

                        const typeTekst = topp.type === "vinter" ? "Vintertopp" : "Sommertopp";
                        const ikon = topp.type === "vinter" ? "❄️" : "☀️";
                        const målside = topp.type === "sommer" ? "sommer.html" : "vinter.html";
                        const url = `${målside}?fjell=${encodeURIComponent(topp.navn)}`;

                        if (!isTouchDevice) {
                            layer.bindTooltip(`
                                <b>${topp.navn}</b><br>
                                <span style="font-size:11px; color:#aaa; font-weight:normal;">${ikon} ${typeTekst}</span>
                            `, {
                                sticky: true,
                                className: 'track-tooltip',
                                direction: 'top',
                                offset: [0, -10]
                            });

                            layer.on('mouseover', function() {
                                layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                                layer.bringToFront();
                            });

                            layer.on('mouseout', function() {
                                layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
                                layer.closeTooltip();
                            });

                            layer.on('click', function() {
                                window.location.href = url;
                            });
                        } else {
                            layer.bindPopup(`
                                <b style="font-size:14px; color:#fff;">${topp.navn}</b><br>
                                <span style="font-size:11px; color:#aaa;">${ikon} ${typeTekst}</span><br>
                                <a href="${url}" class="popup-link-btn">Se detaljer ➔</a>
                            `, { closeButton: false, offset: [0, -5] });

                            layer.on('popupopen', function() {
                                layer.setStyle({ color: 'var(--highlight-orange)', opacity: 1.0, weight: 3.0 });
                            });
                            layer.on('popupclose', function() {
                                layer.setStyle({ color: '#ffffff', opacity: 0.4, weight: 1.4 });
                            });
                        }
                        
                        tryNext();
                    });

                    track.on('error', function() {
                        console.warn("Kunne ikke laste GPX-fil:", topp.fil);
                        tryNext();
                    });

                    track.addTo(map);
                } catch (err) {
                    console.warn("Feil ved opprettelse av GPX-lag:", err);
                    tryNext();
                }
            });
        }

        initialiserKart();

        // FILTRERING
        const btnVinter = document.getElementById('btn-vinter');
        const btnSommer = document.getElementById('btn-sommer');

        function filtrerTurer(valgtType) {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            if (valgtType === 'vinter') btnVinter.classList.add('active');
            if (valgtType === 'sommer') btnSommer.classList.add('active');

            lagredeSpor.forEach(item => {
                if (item.type === valgtType) {
                    if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                } else {
                    if (map.hasLayer(item.layer)) map.removeLayer(item.layer);
                }
            });
            zoomTilAktiveSpor();
        }

        btnVinter.addEventListener('click', () => filtrerTurer('vinter'));
        btnSommer.addEventListener('click', () => filtrerTurer('sommer'));

        document.getElementById('btn-reset').addEventListener('click', function() {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            lagredeSpor.forEach(item => {
                if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                item.layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
            });

            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        });

        /* ==========================================================================
           FELLES FUNKSJON FOR CANVAS POSISJON
           ========================================================================== */
        function updateCanvasPosition(c, ctx, active) {
            if (!active) return;
            const b = map.getBounds(), size = map.getSize(), tl = map.latLngToLayerPoint(b.getNorthWest());
            c.style.left = tl.x + 'px'; 
            c.style.top = tl.y + 'px';
            c.width = size.x; 
            c.height = size.y;
        }

        /* ==========================================================================
           FLYRADAR FUNKSJONALITET
           ========================================================================== */
        const btnFly = document.getElementById('btn-fly');
        const flightPanel = document.getElementById('flight-panel');
        const counterEl = document.getElementById('counter');
        
        let flightsActive = false;
        let flights = {};
        let flightInterval = null;

        const flightCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(flightCanvas);
        const flightCtx = flightCanvas.getContext('2d');

        async function fetchFlights() {
            if (!flightsActive) return;
            const b = map.getBounds();
            const url = `https://corsproxy.io/?https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${b.getNorth().toFixed(1)},${b.getSouth().toFixed(1)},${b.getWest().toFixed(1)},${b.getEast().toFixed(1)}%26faa=1%26air=1&_=${Date.now()}`;
            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                let count = 0;
                for (let id in data) {
                    if (id === "full_count" || id === "version" || id === "stats") continue;
                    if (!flights[id]) flights[id] = { history: [] };
                    flights[id].lat = data[id][1];
                    flights[id].lon = data[id][2];
                    flights[id].flight = data[id][13];
                    flights[id].callsign = data[id][16];
                    flights[id].reg = data[id][9]; 
                    flights[id].alt = data[id][4]; 
                    flights[id].origin = data[id][11];
                    flights[id].dest = data[id][12];
                    flights[id].history.push([data[id][1], data[id][2]]);
                    if (flights[id].history.length > 60) flights[id].history.shift();
                    count++;
                }
                counterEl.innerText = "Fly synlige: " + count;
            } catch(e) {}
        }

        function drawFlights() {
            if (!flightsActive) return;
            flightCtx.clearRect(0, 0, flightCanvas.width, flightCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showTrails = document.getElementById('trailSwitch').checked;
            const showFlight = document.getElementById('flightNumSwitch').checked;
            const showCallsign = document.getElementById('callsignSwitch').checked;
            const showReg = document.getElementById('regSwitch').checked;
            const altMode = document.getElementById('altSlider').value;
            const showOrigin = document.getElementById('originSwitch').checked;
            const showDest = document.getElementById('destSwitch').checked;

            for (let id in flights) {
                const f = flights[id];
                const p = map.latLngToLayerPoint([f.lat, f.lon]);
                
                flightCtx.fillStyle = "#ffd700";
                flightCtx.beginPath(); 
                flightCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                flightCtx.fill();
                
                flightCtx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                flightCtx.lineWidth = 2;
                flightCtx.stroke();

                let labels = [];
                if (showFlight) labels.push(f.flight);
                if (showCallsign) labels.push(f.callsign);
                if (showReg) labels.push(f.reg || "N/A");
                
                if (altMode == 1) labels.push(f.alt + "ft");
                else if (altMode == 2) labels.push(Math.round(f.alt * 0.3048) + "m");
                
                if (showOrigin && showDest) labels.push(`${f.origin || '??'} → ${f.dest || '??'}`);
                else if (showOrigin) labels.push(`${f.origin || '??'} →`);
                else if (showDest) labels.push(`→ ${f.dest || '??'}`);

                if (labels.length > 0) {
                    flightCtx.font = "11px -apple-system, sans-serif";
                    flightCtx.fillStyle = "#ffea75";
                    flightCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }

                if (showTrails && f.history.length > 2) {
                    flightCtx.beginPath();
                    flightCtx.strokeStyle = "rgba(255, 215, 0, 0.5)";
                    flightCtx.lineWidth = 1.5;
                    const pStart = map.latLngToLayerPoint(f.history[0]);
                    flightCtx.moveTo(pStart.x - tl.x, pStart.y - tl.y);
                    for (let i = 1; i < f.history.length - 1; i++) {
                        const p = map.latLngToLayerPoint(f.history[i]);
                        const next = map.latLngToLayerPoint(f.history[i+1]);
                        flightCtx.quadraticCurveTo(p.x - tl.x, p.y - tl.y, (p.x + next.x)/2 - tl.x, (p.y + next.y)/2 - tl.y);
                    }
                    flightCtx.stroke();
                }
            }
            requestAnimationFrame(drawFlights);
        }

        function toggleFlyVisning() {
            flightsActive = !flightsActive;

            if (flightsActive) {
                btnFly.classList.add('active');
                flightPanel.classList.add('active');
                counterEl.classList.add('active');
                flightCanvas.style.display = 'block';

                updateCanvasPosition(flightCanvas, flightCtx, flightsActive);
                fetchFlights();
                flightInterval = setInterval(fetchFlights, 15000);
                drawFlights();

                map.on('move zoom', handleFlightMove);
                map.on('moveend', fetchFlights);
            } else {
                btnFly.classList.remove('active');
                flightPanel.classList.remove('active');
                counterEl.classList.remove('active');
                flightCanvas.style.display = 'none';

                if (flightInterval) clearInterval(flightInterval);
                flightCtx.clearRect(0, 0, flightCanvas.width, flightCanvas.height);
                flights = {};

                map.off('move zoom', handleFlightMove);
                map.off('moveend', fetchFlights);
            }
        }

        function handleFlightMove() {
            updateCanvasPosition(flightCanvas, flightCtx, flightsActive);
        }

        btnFly.addEventListener('click', toggleFlyVisning);

        /* ==========================================================================
           BUSSRADAR FUNKSJONALITET (ENTUR VEHICLE API / GRAPHQL)
           ========================================================================== */
        const btnBuss = document.getElementById('btn-buss');
        const busPanel = document.getElementById('bus-panel');
        const busCounterEl = document.getElementById('bus-counter');

        let busesActive = false;
        let buses = {};
        let busInterval = null;

        const busCanvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated overlay-canvas');
        map.getPanes().overlayPane.appendChild(busCanvas);
        const busCtx = busCanvas.getContext('2d');
        busCanvas.style.display = 'none'; // Sørg for at den er av som standard

        const VEHICLE_API = 'https://api.entur.io/realtime/v2/vehicles/graphql';

        function erITromso(lat, lon) {
            return lat >= 69.55 && lat <= 69.78 && lon >= 18.80 && lon <= 19.25;
        }

        const vehicleQuery = `
            {
                vehicles {
                    vehicleId
                    delay
                    line {
                        publicCode
                        lineName
                    }
                    location {
                        latitude
                        longitude
                    }
                }
            }
        `;

        async function fetchBuses() {
            if (!busesActive) return;

            try {
                const response = await fetch(VEHICLE_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ET-Client-Name': 'tromso-busskart-realtime'
                    },
                    body: JSON.stringify({ query: vehicleQuery })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                const vehicles = json.data?.vehicles || [];
                
                let count = 0;
                const activeIds = new Set();

                vehicles.forEach(bus => {
                    if (!bus.location || !bus.location.latitude || !bus.location.longitude) return;

                    const lat = bus.location.latitude;
                    const lon = bus.location.longitude;

                    if (erITromso(lat, lon)) {
                        const lineCode = bus.line?.publicCode || 'Buss';
                        const lineName = bus.line?.lineName || 'Troms Fylkestrafikk';
                        const vehicleId = bus.vehicleId || `${lineCode}-${lat}-${lon}`;
                        const delayMin = bus.delay ? Math.round(bus.delay / 60) : 0;

                        activeIds.add(vehicleId);

                        if (!buses[vehicleId]) buses[vehicleId] = {};

                        buses[vehicleId].lat = lat;
                        buses[vehicleId].lon = lon;
                        buses[vehicleId].line = lineCode;
                        buses[vehicleId].name = lineName;
                        buses[vehicleId].delay = delayMin;

                        count++;
                    }
                });

                for (let id in buses) {
                    if (!activeIds.has(id)) {
                        delete buses[id];
                    }
                }

                busCounterEl.innerText = "Busser synlige: " + count;
            } catch(e) {
                console.error("Feil ved henting av bussdata:", e);
                busCounterEl.innerText = "Tilkoblingsfeil buss";
            }
        }

        function drawBuses() {
            if (!busesActive) return;
            busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
            
            const showLine = document.getElementById('busLineSwitch').checked;
            const showDest = document.getElementById('busDestSwitch').checked;
            const showDelay = document.getElementById('busDelaySwitch').checked;

            for (let id in buses) {
                const b = buses[id];
                const p = map.latLngToLayerPoint([b.lat, b.lon]);
                
                busCtx.fillStyle = "#ef4444";
                busCtx.beginPath(); 
                busCtx.arc(p.x - tl.x, p.y - tl.y, 4, 0, Math.PI * 2); 
                busCtx.fill();
                
                busCtx.strokeStyle = "rgba(239, 68, 68, 0.4)";
                busCtx.lineWidth = 2;
                busCtx.stroke();

                let labels = [];
                if (showLine) labels.push("Linje " + b.line);
                if (showDest && b.name) labels.push(b.name);
                if (showDelay && b.delay !== 0) {
                    const delayTxt = b.delay > 0 ? `+${b.delay}m` : `${b.delay}m`;
                    labels.push(delayTxt);
                }

                if (labels.length > 0) {
                    busCtx.font = "11px -apple-system, sans-serif";
                    busCtx.fillStyle = "#fca5a5";
                    busCtx.fillText(labels.join(" | "), p.x - tl.x + 9, p.y - tl.y + 4);
                }
            }
            requestAnimationFrame(drawBuses);
        }

        // Klikk-håndtering for enkeltbuss (viser popup med informasjon)
        map.on('click', function(e) {
            if (!busesActive) return;
            
            const clickPoint = map.latLngToContainerPoint(e.latlng);
            let clickedBus = null;
            let minDist = 20;

            const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());

            for (let id in buses) {
                const b = buses[id];
                const p = map.latLngToLayerPoint([b.lat, b.lon]);
                const screenX = p.x - tl.x;
                const screenY = p.y - tl.y;

                const dist = Math.hypot(clickPoint.x - screenX, clickPoint.y - screenY);
                if (dist < minDist) {
                    minDist = dist;
                    clickedBus = b;
                }
            }

            if (clickedBus) {
                const delayText = clickedBus.delay !== 0 ? 
                    `<br>Forsinkelse: <span style="color:${clickedBus.delay > 0 ? '#ef4444' : '#34a853'}">${clickedBus.delay > 0 ? '+' + clickedBus.delay : clickedBus.delay} min</span>` : 
                    `<br>Forsinkelse: I rute`;

                L.popup({ offset: [0, -5] })
                    .setLatLng([clickedBus.lat, clickedBus.lon])
                    .setContent(`
                        <b style="font-size:14px; color:#fff;">Linje ${clickedBus.line}</b><br>
                        <span style="font-size:12px; color:#aaa;">${clickedBus.name || 'Troms Fylkestrafikk'}</span>
                        ${delayText}
                    `)
                    .openOn(map);
            }
        });

        function toggleBussVisning() {
            busesActive = !busesActive;

            if (busesActive) {
                btnBuss.classList.add('active');
                busPanel.classList.add('active');
                busCounterEl.classList.add('active');
                busCounterEl.innerText = "Busser: Laster...";
                busCanvas.style.display = 'block';

                updateCanvasPosition(busCanvas, busCtx, busesActive);
                fetchBuses();
                busInterval = setInterval(fetchBuses, 5000);
                drawBuses();

                map.on('move zoom', handleBusMove);
            } else {
                btnBuss.classList.remove('active');
                busPanel.classList.remove('active');
                busCounterEl.classList.remove('active');
                busCanvas.style.display = 'none';

                if (busInterval) clearInterval(busInterval);
                busCtx.clearRect(0, 0, busCanvas.width, busCanvas.height);
                buses = {};

                map.off('move zoom', handleBusMove);
            }

            // Zoom inn til Tromsøya når buss-knappen klikkes
            map.setView([69.6492, 18.9553], 13);
        }

        function handleBusMove() {
            updateCanvasPosition(busCanvas, busCtx, busesActive);
        }

        btnBuss.addEventListener('click', toggleBussVisning);
    </script>
</body>
</html>
