<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        #loading-status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.95);
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid #333;
            font-size: 0.85rem;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--highlight-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }
        .popup-link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--highlight-orange);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                min-height: auto;
            }
            h1 { 
                position: static; 
                transform: none; 
                font-size: 0.9rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .btn {
                flex: 1;
                text-align: center;
                padding: 10px 5px;
                font-size: 0.8rem;
            }
            #loading-status {
                bottom: auto;
                top: 20px;
            }
            .leaflet-bottom { bottom: 110px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
        </div>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div id="loading-status">
            <span class="spinner"></span>
            <span id="loading-text">Leser inn hovedspor...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([69.65, 18.95], 9);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const gpxOptions = {
            async: true,
            polyline_options: {
                color: '#ffffff',
                opacity: 0.4,
                weight: 1.4,
                lineCap: 'round'
            },
            marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
        };

        let loadedCount = 0;
        let totalFiles = 0;
        const bounds = L.latLngBounds();
        const lagredeSpor = [];

        async function hentTopper(url, type) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Kunne ikke hente ${url}`);

                // Direct JSON parsing if URL points to a JSON file (like sommer_topper.json)
                if (url.endsWith('.json')) {
                    const data = await response.json();
                    return data.map(topp => ({
                        navn: topp.navn,
                        fil: topp.fil,
                        type: type
                    }));
                }

                // Regex parsing if URL points to an HTML file (like vinter.html)
                const htmlText = await response.text();
                const funneTopper = [];

                const topperBlockMatch = htmlText.match(/(?:const|let|var)\s+\w*(?:topper|turer)\w*\s*=\s*(\[[\s\S]*?\]);/i);

                if (topperBlockMatch && topperBlockMatch[1]) {
                    const blockText = topperBlockMatch[1];
                    const objectRegex = /\{[\s\S]*?\}/g;
                    let objMatch;

                    while ((objMatch = objectRegex.exec(blockText)) !== null) {
                        const objStr = objMatch[0];
                        const navnMatch = objStr.match(/(?:navn|tittel|title|name)\s*:\s*["']([^"']+)["']/i);
                        const gpxMatch = objStr.match(/["']([^"']+\.gpx)["']/i);

                        if (gpxMatch && gpxMatch[1]) {
                            const filnavn = gpxMatch[1].split('/').pop().trim();
                            const fjellNavn = navnMatch ? navnMatch[1].trim() : filnavn.replace('.gpx', '');

                            if (!funneTopper.some(t => t.fil === filnavn)) {
                                funneTopper.push({ navn: fjellNavn, fil: filnavn, type });
                            }
                        }
                    }
                }

                return funneTopper;

            } catch (error) {
                console.error("Feil ved henting av " + type + "-data:", error);
                return [];
            }
        }

        function zoomTilAktiveSpor() {
            const aktiveBounds = L.latLngBounds();
            lagredeSpor.forEach(item => {
                if (map.hasLayer(item.layer)) {
                    aktiveBounds.extend(item.layer.getBounds());
                }
            });
            if (aktiveBounds.isValid()) {
                map.fitBounds(aktiveBounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        }

        function sjekkFremdrift() {
            loadedCount++;
            const statusText = document.getElementById('loading-text');
            if (statusText) {
                statusText.textContent = `Laster inn hovedspor... ${loadedCount}/${totalFiles}`;
            }

            if (loadedCount >= totalFiles) {
                zoomTilAktiveSpor();
                const statusEl = document.getElementById('loading-status');
                if (statusEl) {
                    statusEl.style.opacity = '0';
                    setTimeout(() => statusEl.remove(), 500);
                }
            }
        }

        async function initialiserKart() {
            const [vinterTopper, sommerTopper] = await Promise.all([
                hentTopper('vinter.html', 'vinter'),
                hentTopper('sommer_topper.json', 'sommer')
            ]);

            const alleTopper = [...vinterTopper, ...sommerTopper];
            totalFiles = alleTopper.length;

            if (totalFiles === 0) {
                const statusEl = document.getElementById('loading-status');
                if (statusEl) statusEl.innerHTML = "Fant ingen topper.";
                return;
            }

            document.getElementById('loading-text').textContent = `Laster inn hovedspor... 0/${totalFiles}`;

            alleTopper.forEach(topp => {
                const track = new L.GPX('gpx/' + topp.fil, gpxOptions);
                
                track.on('loaded', function(e) {
                    const layer = e.target;
                    lagredeSpor.push({ layer: layer, type: topp.type });

                    const gpxBounds = layer.getBounds();
                    if (gpxBounds.isValid()) {
                        bounds.extend(gpxBounds);
                    }

                    const typeTekst = topp.type === "vinter" ? "Vintertopp" : "Sommertopp";
                    const ikon = topp.type === "vinter" ? "❄️" : "☀️";
                    const målside = topp.type === "sommer" ? "sommer.html" : "vinter.html";

                    const url = `${målside}?fjell=${encodeURIComponent(topp.navn)}`;

                    if (!isTouchDevice) {
                        layer.bindTooltip(`
                            <b>${topp.navn}</b><br>
                            <span style="font-size:11px; color:#aaa; font-weight:normal;">${ikon} ${typeTekst}</span>
                        `, {
                            sticky: true,
                            className: 'track-tooltip',
                            direction: 'top',
                            offset: [0, -10]
                        });

                        layer.on('mouseover', function() {
                            layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                            layer.bringToFront();
                        });

                        layer.on('mouseout', function() {
                            layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
                            layer.closeTooltip();
                        });

                        layer.on('click', function() {
                            window.location.href = url;
                        });
                    } else {
                        layer.bindPopup(`
                            <b style="font-size:14px; color:#fff;">${topp.navn}</b><br>
                            <span style="font-size:11px; color:#aaa;">${ikon} ${typeTekst}</span><br>
                            <a href="${url}" class="popup-link-btn">Se detaljer ➔</a>
                        `, { closeButton: false, offset: [0, -5] });

                        layer.on('popupopen', function() {
                            layer.setStyle({ color: 'var(--highlight-orange)', opacity: 1.0, weight: 3.0 });
                        });
                        layer.on('popupclose', function() {
                            layer.setStyle({ color: '#ffffff', opacity: 0.4, weight: 1.4 });
                        });
                    }
                    
                    sjekkFremdrift();
                });

                track.on('error', function() {
                    console.warn("Klarte ikke å laste GPX-fil:", topp.fil);
                    sjekkFremdrift();
                });

                track.addTo(map);
            });
        }

        initialiserKart();

        // FILTRERING
        const btnVinter = document.getElementById('btn-vinter');
        const btnSommer = document.getElementById('btn-sommer');

        function filtrerTurer(valgtType) {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            if (valgtType === 'vinter') btnVinter.classList.add('active');
            if (valgtType === 'sommer') btnSommer.classList.add('active');

            lagredeSpor.forEach(item => {
                if (item.type === valgtType) {
                    if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                } else {
                    if (map.hasLayer(item.layer)) map.removeLayer(item.layer);
                }
            });
            zoomTilAktiveSpor();
        }

        btnVinter.addEventListener('click', () => filtrerTurer('vinter'));
        btnSommer.addEventListener('click', () => filtrerTurer('sommer'));

        document.getElementById('btn-reset').addEventListener('click', function() {
            btnVinter.classList.remove('active');
            btnSommer.classList.remove('active');

            lagredeSpor.forEach(item => {
                if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                item.layer.setStyle({ color: '#ffffff', weight: 1.4, opacity: 0.4 });
            });

            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: isTouchDevice ? [40, 100] : [40, 40] });
            }
        });
    </script>
</body>
</html>
